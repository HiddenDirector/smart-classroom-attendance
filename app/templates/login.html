{% extends "base.html" %}
{% block title %}Login — Smart Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4 col-xxl-3">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-camera-video text-primary" style="font-size: 2.5rem;"></i>
          <h1 class="h4 mt-2 mb-0">Smart Attendance</h1>
          <p class="text-body-secondary small">Sign in to continue</p>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" required autofocus autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-body-secondary small mt-3 mb-0">
      No account? Ask an administrator, or create one with <code>flask create-user</code>.
    </p>
  </div>
</div>
{% endblock %}
